# Device list for warp, kept apart from the host configuration so the set
# under test can be changed without touching credentials or build settings.
# cijoe combines configurations, so pass both:
#
#   cijoe cijoe/workflows/bench-upcie.yaml \
#     -c cijoe/configs/bench-warp.toml -c cijoe/configs/bench-warp-bdfs.toml
#
# All nine of warp's NVMe devices. One PM9E1, four PM9A1/980-PRO class on
# bus 82-85, and four S4LV008 on bus c1-c4. The nine-device shape is what
# saturates the host; a single device exercises every code path but is
# bounded by the device rather than by anything xNVMe does.

[upcie.bench]
devices = [
  "0000:01:00.0",
  "0000:82:00.0",
  "0000:83:00.0",
  "0000:84:00.0",
  "0000:85:00.0",
  "0000:c1:00.0",
  "0000:c2:00.0",
  "0000:c3:00.0",
  "0000:c4:00.0",
]
